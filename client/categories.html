<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persouz Finance - Categorias</title>

    <!-- Meta tags para SEO e Compartilhamento (Open Graph) -->
    <meta name="description" content="Controle suas finanças de forma simples e inteligente.">
    <meta property="og:title" content="Persouz Finance">
    <meta property="og:description" content="Controle suas finanças de forma simples e inteligente.">
    <meta property="og:image" content="https://andreisouzasp.github.io/persouz-finance/client/img/logo.png">

    <!-- Estilos e Fontes -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" type="image/png" href="img/favicon.png">

    <!-- Scripts (Defer para carregar após o HTML) -->
    <script src="js/script.js" defer></script>
</head>
<body>
    <!-- Cabeçalho Principal -->
    <header class="header">
        <div class="compact-menu">
            <button type="button" class="btn-menu" aria-label="Abrir menu"><i class="fa-solid fa-bars"></i></button>
        </div>

        <a href="index.html" class="logo" aria-label="Persouz Finance - Página Inicial">
            <img src="img/logo.png" class="logo-icon" alt="Logo da Persouz Finance">
            <span class="logo-text">Persouz <span class="logo-highlight">Finance</span></span>
        </a>

        <!-- Menu de Navegação -->
        <nav class="nav" aria-label="Navegação Principal">
            <ul>
                <li><a href="index.html"><i class="fa-solid fa-chart-pie"></i> Visão Geral</a></li>
                <li><a href="transactions.html"><i class="fa-solid fa-money-bill-transfer"></i> Transações</a></li>
                <li><a href="categories.html" class="active" aria-current="page"><i class="fa-solid fa-tags"></i> Categorias</a></li>
            </ul>
        </nav>

        <!-- Informações do Usuário -->
        <div class="user-info">
            <div class="user-icon"><i class="fa-solid fa-user"></i></div>
            <span>Olá, <span class="user-name">Andrei</span>!</span>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="container">
        <h1 class="sr-only">Categorias</h1>

        <!-- Botão para Adicionar Categoria -->
        <button type="button" id="open-modal-btn" class="btn-primary btn-small">
            <i class="fa-solid fa-plus"></i> Nova Categoria
        </button>

        <!-- Seção: Despesas -->
        <section class="content-block">
            <h2><i class="fa-solid fa-arrow-down txt-expense"></i> Categorias de Despesas</h2>
            <div class="categories-grid" id="expense-categories"></div>
        </section>

        <!-- Seção: Receitas -->
        <section class="content-block">
            <h2><i class="fa-solid fa-arrow-up txt-income"></i> Categorias de Receitas</h2>
            <div class="categories-grid" id="income-categories"></div>
        </section>
    </main>

    <!-- Estrutura do Modal (Oculto por padrão) -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Adicionar Categoria</h3>
                <button type="button" id="close-modal-btn" class="modal-close" aria-label="Fechar modal">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form id="category-form">
                <div class="form-group">
                    <label for="category-name">Nome</label>
                    <input type="text" id="category-name" name="desc" placeholder="Digite o nome da categoria" required>
                </div>

                <div class="form-group">
                    <label for="category-type">Tipo</label>
                    <select id="category-type" name="type" required>
                        <option value="expense" selected>Despesa</option>
                        <option value="income">Receita</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Ícone</label>
                    <div class="icon-picker" id="category-icon-picker"></div>
                </div>

                <div class="form-group">
                    <label>Cor</label>
                    <div class="color-picker" id="category-color-picker"></div>
                </div>

                <div class="form-btns">
                    <button type="submit" class="btn-primary">Confirmar</button>
                    <button type="button" id="btn-delete-category" class="btn-primary btn-delete">Excluir</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Rodapé -->
    <footer class="footer">
        <small>Persouz Finance &copy; 2026 | Todos os direitos reservados.</small>
    </footer>
</body>
</html>
