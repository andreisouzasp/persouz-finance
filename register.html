<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persouz Finance - Registro</title>

    <!-- Meta tags para SEO e Compartilhamento (Open Graph) -->
    <meta property="og:title" content="Persouz Finance">
    <meta property="og:description" content="Controle suas finanças de forma simples e inteligente.">
    <meta property="og:image" content="https://andreisouzasp.github.io/persouz-finance/img/persouz-logo.png">
    <meta property="og:image:width" content="600">
    <meta property="og:image:height" content="600">

    <!-- Estilos e Fontes -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="icon" type="image/png" href="img/persouz-logo.png">

    <!-- Scripts (Defer para carregar após o HTML) -->
    <script src="script.js" defer></script>
</head>
<body class="auth-body">
    <!-- Cabeçalho -->
    <header class="auth-header">
        <a href="index.html" class="logo" aria-label="Persouz Finance - Página Inicial">
            <img src="img/persouz-logo.png" class="logo-icon" alt="Logo da Persouz Finance">
            <span class="logo-text">Persouz <span class="logo-highlight">Finance</span></span>
        </a>
        <h1 class="slogan">Controle suas finanças de forma simples e inteligente.</h1>
    </header>

    <!-- Formulário -->
    <main class="auth-container">
        <section class="content-block">
            <h2>Cadastro</h2>

            <form id="register-form" action="#" method="POST">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Seu nome de usuário" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="pass">Senha</label>
                    <input type="password" id="pass" name="pass" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-pass">Confirmar senha</label>
                    <input type="password" id="confirm-pass" name="confirm-pass" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Criar conta</button>
            </form>

            <div class="auth-footer">
                <span>Já possui uma conta? <a href="login.html">Fazer login</a></span>
            </div>
        </section>
    </main>
</body>
</html>
