<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:title" content="Persouz Finance">
    <meta property="og:description" content="Controle suas finanças de forma simples e inteligente.">
    <meta property="og:image" content="https://andreisouzasp.github.io/persouz-finance/img/persouz-icon.png">
    <title>Persouz Finance - Criar conta</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="icon" type="image/png" href="img/persouz-icon.png">
</head>
<body class="login-body">
    <header class="login-header">
        <img src="img/persouz-logo.png" width="300" alt="Logo Persouz Finance">
        <p class="slogan">Seu dinheiro sob controle.</p>
    </header>
    <main class="login-container">
        <section class="content-block">
            <h1>Cadastro</h1>

            <form id="register-form">
                <div class="form-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" name="username" autocomplete="username" placeholder="Seu nome de usuário" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" autocomplete="email" placeholder="seu@email.com" required>
                </div>

                <div class="form-group">
                    <label for="pass">Senha</label>
                    <input type="password" id="pass" name="pass" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label for="confirm-pass">Confirmar senha</label>
                    <input type="password" id="confirm-pass" name="confirm-pass" autocomplete="new-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Criar conta</button>
            </form>

            <div class="auth-footer">
                <p>Já possui uma conta? <a href="login">Fazer login</a></p>
            </div>
        </section>
    </main>
</body>
</html>
