<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persouz Finance - Visão Geral</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="img/persouz-icon.png">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="header">
        <div class="logo">
            <img src="img/persouz-logo.png" width="200" alt="Logo Persouz Finance">
        </div>

        <nav class="nav" aria-label="Navegação Principal">
            <ul>
                <li><a href="#" class="active" aria-current="page">Visão Geral</a></li>
                <li><a href="#">Categorias</a></li>
                <li><a href="#">Relatórios</a></li>
            </ul>
        </nav>

        <div class="user-info">
            <p>Olá, <span class="user-name">Andrei</span>!</p>
            <button type="button" class="logout">Sair</button>
        </div>
    </header>

    <main class="container">
        <h1 class="sr-only">Painel dao Persouz Finance</h1>

        <section class="cards">
            <h2 class="sr-only">Resumo Financeiro</h2>

            <article id="balance-card" class="card">
                <h3 class="card-header">Saldo Atual</h3>
                <p class="card-value">R$ 0,00</p>
            </article>
            <article id="income-card" class="card">
                <h3 class="card-header">Receitas</h3>
                <p class="card-value income">+ R$ 0,00</p>
            </article>
            <article id="expense-card" class="card">
                <h3 class="card-header">Despesas</h3>
                <p class="card-value expense">- R$ 0,00</p>
            </article>
        </section>

        <div class="dashboard-content">
            <section class="content-block">
                <h2>Transações</h2>

                <div id="transactions-container">
                    <table id="transactions-table">
                        <thead>
                            <tr>
                                <th scope="col">Data</th>
                                <th scope="col">Descrição</th>
                                <th scope="col">Categoria</th>
                                <th scope="col">Valor</th>
                                <th scope="col">Ação</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="content-block">
                <h2>Adicionar Transação</h2>

                <form id="transactions-form">
                    <div class="form-group">
                        <label for="type">Tipo</label>
                        <select id="type" name="type">
                            <option value="expense">Despesa</option>
                            <option value="income">Receita</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Descrição</label>
                        <input type="text" id="description" name="description" placeholder="Digite uma descrição" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Categoria</label>
                        <select id="category" name="category" required>
                            <option value="" disabled selected>Selecione uma categoria...</option>
                            
                            <optgroup id="expense-group" label="Despesas">
                                <option value="Alimentação">🍽️ Alimentação</option>
                                <option value="Assinaturas">🔔 Assinaturas</option>
                                <option value="Casa">🏡 Casa</option>
                                <option value="Compras">🛒 Compras</option>
                                <option value="Dívidas">⚠️ Dívidas</option>
                                <option value="Educação">🎓 Educação</option>
                                <option value="Empresarial">💼 Empresarial</option>
                                <option value="Investimento">📈 Investimento</option>
                                <option value="Lazer">🏖️ Lazer</option>
                                <option value="Pessoal">👤 Pessoal</option>
                                <option value="Pet">🐾 Pet</option>
                                <option value="Saúde">🏥 Saúde</option>
                                <option value="Serviços">🛠️ Serviços</option>
                                <option value="Taxas">💸 Taxas</option>
                                <option value="Transferências">↔️ Transferências</option>
                                <option value="Transporte">🚗 Transporte</option>
                                <option value="Vestuário">👖 Vestuário</option>
                                <option value="Viagem">✈️ Viagem</option>
                                <option value="Outros">❓ Outros</option>
                            </optgroup>

                            <optgroup id="income-group" label="Receitas">
                                <option value="Cashback">🔄 Cashback</option>
                                <option value="Fatura">🧾 Fatura</option>
                                <option value="Presente">🎁 Presente</option>
                                <option value="Prêmio">🏆 Prêmio</option>
                                <option value="Receitas variáveis">💵 Receitas variáveis</option>
                                <option value="Renda extra">💰 Renda extra</option>
                                <option value="Salário">💳 Salário</option>
                                <option value="Transferências">↔️ Transferências</option>
                                <option value="Outros">❓ Outros</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Data</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="value">Valor (R$)</label>
                        <input type="number" id="value" name="value" step="0.01" min="0.01" inputmode="decimal" placeholder="0,00" required>
                    </div>

                    <button type="submit" class="btn-primary">Adicionar</button>
                </form>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>Persouz Finance &copy; 2026 | Todos os direitos reservados</p>
    </footer>
</body>
</html>
